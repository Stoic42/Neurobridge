<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroBridge - Component Test</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // Mock data for testing
        const mockTranslationResult = {
            intent: "The person is expressing frustration with a technical issue and needs immediate help.",
            misunderstanding: "The high emotional intensity might be interpreted as anger or hostility rather than genuine distress.",
            rewrite: "I'm experiencing a technical problem that's preventing me from completing my work. I need assistance to resolve this issue as soon as possible.",
            emotionIntensity: 75,
            emotionDescription: "High emotional intensity - the person is experiencing significant stress and frustration",
            communicationTips: "Consider taking a short break before addressing the technical issue. Provide clear, step-by-step instructions."
        };

        // Simple test component
        function NeuroBridgeTest() {
            const [showResult, setShowResult] = useState(false);

            return (
                <div className="min-h-screen bg-gray-50 p-8">
                    <div className="max-w-4xl mx-auto">
                        <div className="text-center mb-8">
                            <h1 className="text-3xl font-bold text-gray-900 mb-2">🌉 NeuroBridge</h1>
                            <p className="text-gray-600">AI Communication Bridge - Component Test</p>
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                            {/* Input Section */}
                            <div className="space-y-6">
                                <div className="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
                                    <h3 className="text-lg font-semibold text-gray-800 mb-4">Role Selection</h3>
                                    <div className="grid grid-cols-1 gap-3">
                                        <button className="p-4 rounded-lg border-2 border-blue-500 bg-blue-50 text-left">
                                            <div className="flex items-center space-x-3">
                                                <span className="text-2xl">🧩</span>
                                                <div>
                                                    <div className="font-semibold text-gray-800">ASD</div>
                                                    <div className="text-sm text-gray-600">Autism Spectrum Disorder</div>
                                                </div>
                                            </div>
                                            <div className="mt-2 text-sm text-blue-600 font-medium">✓ Selected</div>
                                        </button>
                                    </div>
                                </div>

                                <div className="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
                                    <h3 className="text-lg font-semibold text-gray-800 mb-4">Text Input</h3>
                                    <textarea
                                        className="w-full p-4 border-2 border-gray-300 rounded-lg resize-none"
                                        rows={4}
                                        placeholder="Type your message here..."
                                        defaultValue="This computer is broken and I can't do my work and I'm going to be late and everything is ruined!"
                                    />
                                    <div className="mt-2 text-sm text-gray-500">95/2000 characters</div>
                                    <button 
                                        onClick={() => setShowResult(true)}
                                        className="w-full mt-4 py-3 px-6 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700 transition-colors"
                                    >
                                        Translate Message
                                    </button>
                                </div>
                            </div>

                            {/* Results Section */}
                            <div className="space-y-6">
                                {showResult && (
                                    <>
                                        {/* Intent Analysis */}
                                        <div className="bg-white rounded-lg border border-gray-200 p-4">
                                            <div className="flex items-center space-x-2 mb-3">
                                                <span className="text-xl">🎯</span>
                                                <h4 className="font-semibold text-gray-800">Intent Analysis</h4>
                                            </div>
                                            <p className="text-gray-700">{mockTranslationResult.intent}</p>
                                        </div>

                                        {/* Misunderstanding */}
                                        <div className="bg-white rounded-lg border border-gray-200 p-4">
                                            <div className="flex items-center space-x-2 mb-3">
                                                <span className="text-xl">⚠️</span>
                                                <h4 className="font-semibold text-gray-800">Potential Misunderstanding</h4>
                                            </div>
                                            <p className="text-gray-700">{mockTranslationResult.misunderstanding}</p>
                                        </div>

                                        {/* Improved Version */}
                                        <div className="bg-white rounded-lg border border-gray-200 p-4">
                                            <div className="flex items-center space-x-2 mb-3">
                                                <span className="text-xl">✨</span>
                                                <h4 className="font-semibold text-gray-800">Improved Version</h4>
                                            </div>
                                            <p className="text-gray-700 mb-4">{mockTranslationResult.rewrite}</p>
                                            
                                            {/* Tone Adjustment Buttons */}
                                            <div className="border-t pt-4">
                                                <h5 className="font-medium text-gray-700 mb-3">Adjust Tone:</h5>
                                                <div className="flex flex-wrap gap-2">
                                                    <button className="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium">
                                                        Direct
                                                    </button>
                                                    <button className="px-4 py-2 bg-green-600 text-white rounded-lg text-sm font-medium">
                                                        Gentle
                                                    </button>
                                                    <button className="px-4 py-2 bg-purple-600 text-white rounded-lg text-sm font-medium">
                                                        Empathetic
                                                    </button>
                                                </div>
                                            </div>
                                        </div>

                                        {/* Emotion Meter */}
                                        <div className="bg-white rounded-lg border border-gray-200 p-6">
                                            <h3 className="text-lg font-semibold text-gray-800 mb-4">Emotional Intensity</h3>
                                            <div className="flex flex-col items-center space-y-4">
                                                <div className="relative w-32 h-32">
                                                    <div className="absolute inset-0 rounded-full border-8 border-gray-200"></div>
                                                    <div className="absolute inset-0 rounded-full border-8 border-transparent"
                                                         style={{
                                                             background: `conic-gradient(from 0deg, #3b82f6 0deg, #3b82f6 ${(mockTranslationResult.emotionIntensity / 100) * 180}deg, #e5e7eb ${(mockTranslationResult.emotionIntensity / 100) * 180}deg, #e5e7eb 360deg)`
                                                         }}>
                                                    </div>
                                                    <div className="absolute inset-4 bg-white rounded-full flex flex-col items-center justify-center">
                                                        <div className="text-2xl font-bold text-gray-800">{mockTranslationResult.emotionIntensity}</div>
                                                        <div className="text-xs text-gray-600">intensity</div>
                                                    </div>
                                                </div>
                                                <div className="text-center">
                                                    <div className="text-lg font-semibold text-red-600">High Intensity</div>
                                                    <div className="mt-2 p-3 bg-red-100 rounded-lg">
                                                        <p className="text-sm text-gray-700">{mockTranslationResult.emotionDescription}</p>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </>
                                )}
                            </div>
                        </div>

                        <div className="mt-8 text-center">
                            <p className="text-sm text-gray-500">
                                This is a component test. For the full application, run the development servers.
                            </p>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<NeuroBridgeTest />, document.getElementById('root'));
    </script>
</body>
</html>
