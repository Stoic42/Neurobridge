# Temporary HTTP-only Nginx configuration for neurobridge.ton-ton.fun
# Use this until SSL certificates are obtained

upstream backend {
    server localhost:8003;
    keepalive 32;
}

upstream frontend {
    server localhost:3002;
    keepalive 32;
}

# HTTP server (temporary - no SSL)
server {
    listen 80;
    listen [::]:80;
    server_name neurobridge.ton-ton.fun;

    # Logging
    access_log /var/log/nginx/neurobridge-access.log;
    error_log /var/log/nginx/neurobridge-error.log;

    # Max upload size
    client_max_body_size 10M;

    # Backend API
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # Frontend app
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Let's Encrypt challenge location (for future SSL setup)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}
